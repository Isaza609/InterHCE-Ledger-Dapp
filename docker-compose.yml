# InterHCE Ledger - Servicios para desarrollo local
# Ver: docs_dev/Sprint 1/Montaje-servidor-HAPI-FHIR-Linux.md

services:
  # Servidor HAPI FHIR: único almacenamiento off-chain (recursos FHIR)
  # API base: http://localhost:8080/fhir/
  hapi-fhir:
    image: hapiproject/hapi:latest
    container_name: interhce-hapi-fhir
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://hapi-fhir-db:5432/hapi
      SPRING_DATASOURCE_USERNAME: hapi
      SPRING_DATASOURCE_PASSWORD: hapi
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    ports:
      - "8080:8080"
    restart: unless-stopped
    depends_on:
      - hapi-fhir-db

  hapi-fhir-db:
    image: postgres:16-alpine
    container_name: interhce-hapi-db
    environment:
      POSTGRES_DB: hapi
      POSTGRES_USER: hapi
      POSTGRES_PASSWORD: hapi
    volumes:
      - hapi-fhir-postgres:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  hapi-fhir-postgres:
